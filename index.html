<title>舞鶴アオリイカ</title>
<style>
:root{
  --bg:#EAF1F1;--card:#FFFFFF;--ink:#14293A;--sub:#5B7180;--line:#D3DFE1;
  --sea:#1E6178;--sea-ink:#124556;--sea-tint:#DCEBEF;
  --mz:#F5E6BF;--mz-ink:#6B4A0B;
  --wd:#F6D8D2;--wd-ink:#8A2A1E;
  --hero:#14293A;--hero-ink:#EEF5F5;--hero-gold:#F2C86B;--hero-sub:#A9C0C8;
  --danger:#B23A2C;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1B24;--card:#15262F;--ink:#E4EEF0;--sub:#8FA6B0;--line:#26404D;
    --sea:#7DBFD6;--sea-ink:#BFE3EF;--sea-tint:#1C3A48;
    --mz:#4A3B16;--mz-ink:#F1D998;
    --wd:#4F2621;--wd-ink:#F4B9B0;
    --hero:#1B3648;--hero-ink:#EEF5F5;--hero-gold:#F2C86B;--hero-sub:#9CB6C0;
    --danger:#F08A7C;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
.top{max-width:520px;margin:0 auto;padding:14px 14px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top .loc{margin:0;font-size:12px;color:var(--sub)}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em;line-height:1.25}
.status{max-width:520px;margin:0 auto;padding:0 14px 8px;font-size:12px;color:var(--sub);min-height:20px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink)}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mut{color:var(--sub);font-size:13px}
h2{font-size:15px;margin:22px 0 8px;font-weight:700}
.wrap>.view>h2:first-child{margin-top:8px}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:16px;padding:18px 16px 14px}
.hero .name{margin:0;font-size:14px;color:var(--hero-sub)}
.hero .time{margin:2px 0 0;font-size:32px;font-weight:700;letter-spacing:.01em;color:var(--hero-gold);line-height:1.2}
.hero .left{margin:2px 0 0;font-size:15px}
.hero dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.16)}
.hero dt{font-size:11px;color:var(--hero-sub);margin:0}
.hero dd{margin:1px 0 0;font-size:15px;font-weight:700}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.m .l{margin:0;font-size:12px;color:var(--sub)}
.m .v{margin:2px 0 0;font-size:20px;font-weight:700;line-height:1.35}
.m .s{margin:0;font-size:12px;color:var(--sub)}
.m .v svg{vertical-align:-4px;margin-right:4px}

svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chart{width:100%;height:auto;display:block}
.chart .line{fill:none;stroke:var(--sea);stroke-width:2.2}
.chart .band{fill:var(--mz)}
.chart .now{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.chart text{font-size:10.5px;fill:var(--sub)}
.chart .dot{fill:var(--sea)}
.chart .ax{stroke:var(--line);stroke-width:1}

.seg{display:flex;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:14px}
.chip.on{background:var(--sea-tint);border-color:var(--sea);color:var(--sea-ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.hgrid{display:grid;grid-template-columns:38px 54px minmax(0,1.15fr) 38px 30px minmax(0,1.2fr);gap:4px;align-items:center}
.hhead{padding:4px 8px;font-size:11px;color:var(--sub)}
.hrow{padding:7px 8px;border-radius:8px;font-size:14px}
.hrow.mz{background:var(--mz);color:var(--mz-ink)}
.hrow.nowr{outline:2px solid var(--sea);outline-offset:-2px}
.hrow b{font-weight:700}
.hrow small{display:block;font-size:11px;color:var(--sub);line-height:1.3}
.hrow.mz small{color:var(--mz-ink);opacity:.8}
.hrow .w.strong{background:var(--wd);color:var(--wd-ink);border-radius:6px;padding:1px 6px;width:fit-content}
.wc{display:flex;align-items:center;gap:3px;font-size:13px}
.wc .em{font-size:17px;line-height:1;flex:none}
.em{font-family:system-ui,'Apple Color Emoji','Segoe UI Emoji',sans-serif;font-style:normal}

<body>

<header class="top">
  <div>
    <p class="loc">京都府 舞鶴</p>
    <h1>アオリイカ</h1>
  </div>
  <button id="refresh" class="ghost" type="button">更新</button>
</header>
<p id="status" class="status" aria-live="polite"></p>

<div id="areabar" class="areabar"></div>

<main class="wrap">
  <section id="v-today" class="view"></section>
  <section id="v-hourly" class="view" hidden></section>
  <section id="v-catch" class="view" hidden></section>
</main>

<nav class="tabs" aria-label="画面の切り替え">
  <button type="button" data-tab="today" class="on">今日</button>
  <button type="button" data-tab="hourly">時間別</button>
  <button type="button" data-tab="catch">釣果</button>
</nav>

<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="bg" data-act="close"></div>
  <div class="body">
    <h3 id="sh-t">釣果を記録</h3>

    <span class="lbl">釣り場</span>
    <div id="f-spots" class="chips"></div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="f-newspot" placeholder="釣り場を追加" maxlength="12" aria-label="釣り場を追加">
      <button type="button" class="ghost" data-act="addspot" style="white-space:nowrap">追加</button>
    </div>
    <p id="f-err" class="err" role="alert"></p>

    <span class="lbl">日付</span>
    <input type="date" id="f-date">

    <span class="lbl">時間帯</span>
    <div id="f-times" class="chips"></div>
    <div id="f-auto" class="auto"></div>

    <span class="lbl">釣れた数</span>
    <div class="step">
      <button type="button" data-act="minus" aria-label="減らす">−</button>
      <output id="f-n">0杯</output>
      <button type="button" data-act="plus" aria-label="増やす">＋</button>
    </div>
    <p class="mut" style="margin:6px 0 0">0杯も記録できます。</p>

    <span class="lbl">胴長（cm）</span>
    <div class="row">
      <input type="number" id="f-smin" inputmode="numeric" min="0" max="80" placeholder="12">
      <span>〜</span>
      <input type="number" id="f-smax" inputmode="numeric" min="0" max="80" placeholder="18">
    </div>

    <span class="lbl">エギの号数</span>
    <div id="f-egi" class="chips"></div>

    <span class="lbl">写真（3枚まで）</span>
    <div id="f-photos" class="thumbs"></div>
    <button type="button" class="ghost" id="f-addph" data-act="pickphoto" style="margin-top:8px">写真を追加</button>
    <p id="f-perr" class="err" role="alert"></p>
    <input type="file" id="f-file" class="vh" accept="image/*" multiple tabindex="-1" aria-hidden="true">

    <span class="lbl">メモ</span>
    <textarea id="f-memo" rows="3" maxlength="200" placeholder="濁りあり、風が強まってから反応が落ちた"></textarea>

    <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:18px">
      <button type="button" class="btn" data-act="close">閉じる</button>
      <button type="button" class="btn pri" id="f-save" data-act="save">保存</button>
    </div>
  </div>
</div>

<div id="spsheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sp-t">
  <div class="bg" data-act="spclose"></div>
  <div class="body">
    <h3 id="sp-t">釣り場と予報の位置</h3>
    <p class="mut" style="margin:0 0 10px">位置を設定した釣り場は、画面上の「予報の場所」で切り替えると、その地点の天気・風・波を見られます。</p>
    <div id="sp-list"></div>
    <span class="lbl">釣り場を追加</span>
    <div class="row">
      <input type="text" id="sp-new" placeholder="釣り場の名前" maxlength="12" aria-label="釣り場の名前">
      <button type="button" class="ghost" data-act="spadd" style="white-space:nowrap">追加</button>
    </div>
    <button type="button" class="btn" data-act="spclose" style="margin-top:16px">閉じる</button>
  </div>
</div>

<div id="toast" role="status"></div>
<input type="file" id="importer" class="vh" accept="application/json,.json" tabindex="-1" aria-hidden="true">
<div id="lb" class="lb" role="dialog" aria-label="写真" data-act="closelb"><img alt="拡大した写真"></div>

<script>
(function(){
'use strict';

var LAT=35.475,LON=135.386;
var MLAT=35.65,MLON=135.4;
var STRONG=6;
var SPOTS0=['田井','神崎','大浦','西舞鶴'];
var SLOTS=['朝マズメ','日中','夕マズメ','夜'];
var EGI=['2.0号','2.5号','3.0号','3.5号'];

var $=function(s,r){return (r||document).querySelector(s);};
var pad=function(n){return String(n).padStart(2,'0');};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},
  del:function(k){try{localStorage.removeItem(k);}catch(e){}}
};

var S={wx:{},sun:{},wave:{},tide:{},rec:[],spots:[],ok:{wx:null,wave:null,tide:null},tideSrc:'',updated:null,pos:{},areaCache:{},waveOff:false};
var UI={tab:'today',hd:0,all:false,spot:'すべて',area:'舞鶴',found:null};
var F={spot:'',time:'朝マズメ',egi:'',n:0,photos:[]};
var MAXPH=3;

function nowJST(){
  var p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  var o={};p.forEach(function(x){o[x.type]=x.value;});
  return {date:o.year+'-'+o.month+'-'+o.day,h:+o.hour,m:+o.minute};
}
function addDays(ds,n){return new Date(Date.parse(ds+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);}
function dowJ(ds){return '日月火水木金土'[new Date(ds+'T00:00:00Z').getUTCDay()];}
function labelDate(ds){var p=ds.split('-');return (+p[1])+'月'+(+p[2])+'日（'+dowJ(ds)+'）';}
function mins(s){s=String(s).slice(-5);var p=s.split(':');return (+p[0])*60+(+p[1]);}
function hm(m){m=((Math.round(m)%1440)+1440)%1440;return Math.floor(m/60)+':'+pad(m%60);}
function dur(m){m=Math.max(0,Math.round(m));var h=Math.floor(m/60),r=m%60;return h?h+'時間'+(r?r+'分':''):r+'分';}

function moonElong(ds){
  var p=ds.split('-'),ms=Date.UTC(+p[0],+p[1]-1,+p[2],0,0,0)-9*3600e3;
  var T=(ms/86400000+2440587.5-2451545.0)/36525,r=Math.PI/180;
  var sn=function(x){return Math.sin(x*r);};
  var Lm=218.3164477+481267.88123421*T,D=297.8501921+445267.1114034*T,M=357.5291092+35999.0502909*T,
      Mm=134.9633964+477198.8675055*T,F=93.272095+483202.0175233*T;
  var lm=Lm+6.288774*sn(Mm)+1.274027*sn(2*D-Mm)+0.658314*sn(2*D)+0.213618*sn(2*Mm)-0.185116*sn(M)-0.114332*sn(2*F)
        +0.058793*sn(2*D-2*Mm)+0.057066*sn(2*D-M-Mm)+0.053322*sn(2*D+Mm)+0.045758*sn(2*D-M)-0.040923*sn(M-Mm)-0.03472*sn(D)-0.030383*sn(M+Mm);
  var L0=280.46646+36000.76983*T,C=(1.914602-0.004817*T)*sn(M)+0.019993*sn(2*M)+0.000289*sn(3*M);
  return (((lm-(L0+C))%360)+360)%360;
}
var SHIO=[[48,'大潮'],[84,'中潮'],[120,'小潮'],[132,'長潮'],[144,'若潮'],[180,'中潮'],[228,'大潮'],[264,'中潮'],[300,'小潮'],[312,'長潮'],[324,'若潮'],[360,'中潮']];
function moonName(ds){
  var e=(moonElong(ds)+12)%360;
  for(var i=0;i<SHIO.length;i++){if(e<SHIO[i][0])return SHIO[i][1];}
  return '中潮';
}
function shio(ds){return (S.tide[ds]&&S.tide[ds].moon)||moonName(ds);}

var DIR8=['北','北東','東','南東','南','南西','西','北西'];
function dir8(d){return d==null?'—':DIR8[Math.round(d/45)%8];}

function fetchJ(u,ms){
  var c=new AbortController(),t=setTimeout(function(){c.abort();},ms||12000);
  return fetch(u,{signal:c.signal}).then(function(r){clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).catch(function(e){clearTimeout(t);throw e;});
}

function areaPos(name){return (name!=='舞鶴'&&S.pos[name])?S.pos[name]:{lat:LAT,lon:LON};}
function fetchWx(pos){
  var u='https://api.open-meteo.com/v1/forecast?latitude='+pos.lat+'&longitude='+pos.lon+
    '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m'+
    '&daily=sunrise,sunset&wind_speed_unit=ms&timezone=Asia%2FTokyo&past_days=2&forecast_days=7';
  return fetchJ(u).then(function(j){
    var h=j.hourly,wx={},sun={};
    h.time.forEach(function(t,i){wx[t]={temp:h.temperature_2m[i],pop:h.precipitation_probability[i],rain:h.precipitation?h.precipitation[i]:null,code:h.weather_code[i],ws:h.wind_speed_10m[i],wd:h.wind_direction_10m[i],wg:h.wind_gusts_10m[i]};});
    j.daily.time.forEach(function(d,i){sun[d]={rise:j.daily.sunrise[i].slice(11,16),set:j.daily.sunset[i].slice(11,16)};});
    return {wx:wx,sun:sun};
  });
}
function marineQ(la,lo){
  return fetchJ('https://marine-api.open-meteo.com/v1/marine?latitude='+la+'&longitude='+lo+'&hourly=wave_height&timezone=Asia%2FTokyo&past_days=2&forecast_days=7').then(function(j){
    var w={},n=0;
    j.hourly.time.forEach(function(t,i){var v=j.hourly.wave_height[i];if(v!=null){w[t]=v;n++;}});
    return {w:w,n:n};
  });
}
function fetchWave(name){
  var off=function(){return marineQ(MLAT,MLON).then(function(r){return {w:r.w,off:true};});};
  if(name==='舞鶴'||!S.pos[name])return off();
  var p=S.pos[name];
  return marineQ(p.lat,p.lon).then(function(r){return r.n>0?{w:r.w,off:false}:off();},off);
}
function loadAreaData(name){
  var c=S.areaCache[name];
  if(c&&Date.now()-c.t<20*60000)return Promise.resolve(c);
  var pos=areaPos(name),e={wx:{},sun:{},wave:{},off:false,okWx:false,okWave:false,t:Date.now()};
  return Promise.all([
    fetchWx(pos).then(function(r){e.wx=r.wx;e.sun=r.sun;e.okWx=true;},function(){}),
    fetchWave(name).then(function(r){e.wave=r.w;e.off=r.off;e.okWave=true;},function(){})
  ]).then(function(){if(e.okWx&&e.okWave)S.areaCache[name]=e;return e;});
}
function applyArea(e){S.wx=e.wx;S.sun=e.sun;S.wave=e.wave;S.ok.wx=e.okWx;S.ok.wave=e.okWave;S.waveOff=e.off;}

var hcP=null;
function tideUrl(hc,ds){var p=ds.split('-');return 'https://api.tide736.net/get_tide.php?pc=26&hc='+hc+'&yr='+p[0]+'&mn='+(+p[1])+'&dy='+(+p[2])+'&rg=day';}
function findHc(force){
  var saved=store.get('ika.hc',null);
  if(saved&&!force)return Promise.resolve(saved);
  if(!force&&Date.now()-store.get('ika.hcfail',0)<24*3600e3)return Promise.reject(new Error('cooldown'));
  if(hcP&&!force)return hcP;
  var ds=nowJST().date,reqs=[];
  for(var i=1;i<=20;i++){(function(hc){
    reqs.push(fetchJ(tideUrl(hc,ds),10000).then(function(j){
      return {hc:hc,ok:true,name:(j&&j.status==1&&j.tide&&j.tide.port)?String(j.tide.port.harbor_namej||''):''};
    }).catch(function(){return {hc:hc,ok:false,name:''};}));
  })(i);}
  hcP=Promise.all(reqs).then(function(r){
    var okc=r.filter(function(x){return x.ok;}).length;
    var ex=r.filter(function(x){return x.name==='舞鶴';})[0]||r.filter(function(x){return x.name.indexOf('舞鶴')>=0;})[0];
    if(!ex){
      var names=r.filter(function(x){return x.name;}).map(function(x){return x.name+'='+x.hc;}).join('、');
      store.set('ika.hcfail',Date.now());
      store.set('ika.hcdiag',okc===0?'取得先に接続できませんでした（通信の問題、またはブラウザに拒否されました）':'舞鶴の港が見つかりませんでした。見つかった港：'+(names||'なし'));
      hcP=null;throw new Error('nohc');
    }
    store.set('ika.hc',ex.hc);store.del('ika.hcfail');store.set('ika.hcdiag','港コード '+ex.hc+'（'+ex.name+'）で取得できています');
    return ex.hc;
  });
  return hcP;
}

function lvl(ser,h){
  if(!ser.length)return null;
  if(h<=ser[0][0])return ser[0][1];
  for(var i=0;i<ser.length-1;i++){
    if(h<=ser[i+1][0]){var a=ser[i],b=ser[i+1],f=(h-a[0])/((b[0]-a[0])||1);return a[1]+(b[1]-a[1])*f;}
  }
  return ser[ser.length-1][1];
}
function synth(ext){
  if(ext.length<2)return [];
  var e=ext.map(function(x){return {t:x.t,cm:x.cm};});
  var a=e[0],b=e[1],y=e[e.length-1],z=e[e.length-2];
  e.unshift({t:a.t-(b.t-a.t),cm:b.cm});e.push({t:y.t+(y.t-z.t),cm:z.cm});
  var out=[];
  for(var t=0;t<=24;t+=0.5){
    var i=0;while(i<e.length-2&&e[i+1].t<=t)i++;
    var p=e[i],q=e[i+1],f=Math.max(0,Math.min(1,(t-p.t)/((q.t-p.t)||1)));
    out.push([t,p.cm+(q.cm-p.cm)*(1-Math.cos(Math.PI*f))/2]);
  }
  return out;
}
function tide736(ds){
  return findHc().then(function(hc){return fetchJ(tideUrl(hc,ds));}).then(function(j){
    var c=j&&j.tide&&j.tide.chart&&j.tide.chart[ds];
    if(!c)throw new Error('nochart');
    var ext=[];
    (c.flood||[]).forEach(function(x){ext.push({t:mins(x.time)/60,type:'満',cm:Math.round(x.cm),time:hm(mins(x.time))});});
    (c.edd||[]).forEach(function(x){ext.push({t:mins(x.time)/60,type:'干',cm:Math.round(x.cm),time:hm(mins(x.time))});});
    ext.sort(function(a,b){return a.t-b.t;});
    var ser=(c.tide||[]).map(function(x){return [mins(x.time)/60,x.cm];}).sort(function(a,b){return a[0]-b[0];});
    if(ser.length<12)ser=synth(ext);
    if(!ser.length)throw new Error('noser');
    var hourly=[];for(var h=0;h<24;h++)hourly.push(Math.round(lvl(ser,h)));
    return {ser:ser,hourly:hourly,ext:ext,moon:(c.moon&&c.moon.title)||'',src:'tide736'};
  });
}
var seaP=null;
function getSea(){
  if(!seaP)seaP=fetchJ('https://marine-api.open-meteo.com/v1/marine?latitude='+MLAT+'&longitude='+MLON+'&hourly=sea_level_height_msl&timezone=Asia%2FTokyo&past_days=2&forecast_days=7').then(function(j){
    var o={};j.hourly.time.forEach(function(t,i){var v=j.hourly.sea_level_height_msl[i];if(v!=null)o[t]=Math.round(v*100);});return o;
  });
  return seaP;
}
function seaTide(ds){
  return getSea().then(function(o){
    var hourly=[];
    for(var h=0;h<24;h++){var v=o[ds+'T'+pad(h)+':00'];if(v==null)throw new Error('nosea');hourly.push(v);}
    var ser=hourly.map(function(v,h){return [h,v];});ser.push([24,hourly[23]]);
    var ext=[];
    for(var i=1;i<23;i++){
      if(hourly[i]>=hourly[i-1]&&hourly[i]>hourly[i+1])ext.push({t:i,type:'満',cm:hourly[i],time:i+':00'});
      if(hourly[i]<=hourly[i-1]&&hourly[i]<hourly[i+1])ext.push({t:i,type:'干',cm:hourly[i],time:i+':00'});
    }
    return {ser:ser,hourly:hourly,ext:ext,moon:'',src:'model'};
  });
}
function getTide(ds){
  if(S.tide[ds])return Promise.resolve(S.tide[ds]);
  var c=store.get('ika.tide.'+ds,null);
  if(c){S.tide[ds]=c;return Promise.resolve(c);}
  return tide736(ds).catch(function(){return seaTide(ds);}).then(function(d){
    S.tide[ds]=d;S.tideSrc=d.src;
    if(d.src==='tide736')store.set('ika.tide.'+ds,d);
    return d;
  });
}
function pruneCache(){

    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('ika.tide.')===0&&k.slice(9)<lim)del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});

function tideAt(d,h){
  var t=S.tide[d];if(!t)return null;
  var cm=t.hourly[h],nx=h<23?t.hourly[h+1]:cm;
  var ev=t.ext.filter(function(e){return Math.floor(e.t)===h;})[0];
  return {cm:cm,dir:nx>cm?'上げ':(nx<cm?'下げ':'—'),ev:ev?ev.type+' '+ev.time:''};
}
function slotHour(d,slot,s){
  if(s===undefined)s=S.sun[d];
  if(slot==='朝マズメ')return s?Math.floor(mins(s.rise)/60):5;
  if(slot==='夕マズメ')return s?Math.floor(mins(s.set)/60):17;
  return slot==='夜'?21:12;
}
function getConds(d,slot,spot){
  var name=(spot&&S.pos[spot])?spot:'舞鶴',c={};
  return loadAreaData(name).then(function(e){
    var h=slotHour(d,slot,e.sun[d]),k=d+'T'+pad(h)+':00',w=e.wx[k];
    if(w&&w.ws!=null)c.wind=dir8(w.wd)+' '+Math.round(w.ws)+'m';
    if(e.wave[k]!=null)c.wave=e.wave[k].toFixed(1)+'m';
  }).then(function(){return getTide(d);}).then(function(){c.tide=shio(d);return c;},function(){c.tide=shio(d);return c;});
}

function ico(code,night){
  var e='☁️',t='曇り';
  if(code===0||code===1){e=night?'🌙':'☀️';t=night?'晴れ（夜）':'晴れ';}
  else if(code===2){e=night?'☁️':'⛅';t='薄曇り';}
  else if(code===45||code===48){e='🌫️';t='霧';}
  else if((code>=51&&code<=67)||(code>=80&&code<=82)){e='☂️';t='雨';}
  else if((code>=71&&code<=77)||code===85||code===86){e='❄️';t='雪';}
  else if(code>=95){e='⛈️';t='雷雨';}
  return '<span class="em" role="img" aria-label="'+t+'">'+e+'</span>';
}
function isNight(ds,h){
  var s=S.sun[ds];
  if(!s)return h<5||h>=18;
  var m=h*60+30;
  return m<mins(s.rise)||m>=mins(s.set);
}
function wxText(code){
  if(code===0)return '快晴';if(code===1)return '晴れ';if(code===2)return '薄曇り';if(code===3)return '曇り';
  if(code===45||code===48)return '霧';
  if(code>=51&&code<=57)return '霧雨';if(code>=61&&code<=67)return '雨';
  if(code>=71&&code<=77||code===85||code===86)return '雪';
  if(code>=80&&code<=82)return 'にわか雨';if(code>=95)return '雷雨';return '—';
}
function arrow(d){
  if(d==null)return '';

}

function windows(d){
  var s=S.sun[d];if(!s)return [];
  var r=mins(s.rise),t=mins(s.set);

}
function nextMazume(n){
  var ds=n.date,now=n.h*60+n.m;
  for(var i=0;i<2;i++){
    var d=addDays(ds,i),off=i*1440,w=windows(d);
    for(var j=0;j<w.length;j++){
      if(w[j].e+off>now)return {k:w[j].k,d:d,s:w[j].s,e:w[j].e,toStart:w[j].s+off-now,toEnd:w[j].e+off-now};
    }
  }
  return null;
}

function nextTideEvent(n){

function chartSvg(ds,n){
  var t=S.tide[ds];
  if(!t)return '<p class="mut">潮位を取得できませんでした。</p>';
  var W=340,H=132,pl=8,pr=8,pt=16,pb=26;
  var vals=t.ser.map(function(p){return p[1];}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mx-mn<20){var c=(mx+mn)/2;mn=c-10;mx=c+10;}
  var X=function(h){return pl+(W-pl-pr)*h/24;};
  var Y=function(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));};
  var p=t.ser,d='M'+X(p[0][0]).toFixed(1)+','+Y(p[0][1]).toFixed(1);
  for(var i=1;i<p.length-1;i++){
    var cx=X(p[i][0]),cy=Y(p[i][1]),nx=(cx+X(p[i+1][0]))/2,ny=(cy+Y(p[i+1][1]))/2;
    d+=' Q'+cx.toFixed(1)+','+cy.toFixed(1)+' '+nx.toFixed(1)+','+ny.toFixed(1);
  }
  d+=' L'+X(p[p.length-1][0]).toFixed(1)+','+Y(p[p.length-1][1]).toFixed(1);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img"><title>'+labelDate(ds)+'の潮位</title>';
  windows(ds).forEach(function(w){
    var a=Math.max(0,w.s)/60,b=Math.min(1440,w.e)/60;
    s+='<rect class="band" x="'+X(a).toFixed(1)+'" y="'+pt+'" width="'+(X(b)-X(a)).toFixed(1)+'" height="'+(H-pt-pb)+'" rx="3"/>';
  });
  s+='<line class="ax" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  [0,6,12,18,24].forEach(function(h){s+='<text x="'+X(h).toFixed(1)+'" y="'+(H-pb+13)+'" text-anchor="'+(h===0?'start':(h===24?'end':'middle'))+'">'+h+'</text>';});
  s+='<path class="line" d="'+d+'"/>';
  t.ext.forEach(function(e){
    var x=X(e.t),y=Y(e.cm),up=e.type==='満';
    s+='<circle class="dot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3"/>'+
       '<text x="'+x.toFixed(1)+'" y="'+(up?y-7:y+15).toFixed(1)+'" text-anchor="middle">'+e.type+' '+e.time+'</text>';
  });
  if(ds===n.date){var nx=X(n.h+n.m/60);s+='<line class="now" x1="'+nx.toFixed(1)+'" x2="'+nx.toFixed(1)+'" y1="'+pt+'" y2="'+(H-pb)+'"/>';}
  return s+'</svg>';
}

function dayStats(ds){
  var t=[],r=0,wmax=null,code=null;
  for(var h=0;h<24;h++){
    var w=S.wx[ds+'T'+pad(h)+':00'];if(!w)continue;
    if(w.temp!=null)t.push(w.temp);
    if(w.rain!=null)r+=w.rain;
    if(h>=4&&h<=20&&w.ws!=null&&(wmax===null||w.ws>wmax))wmax=w.ws;
    if(h===12)code=w.code;
  }
  if(!t.length)return null;
  return {hi:Math.round(Math.max.apply(null,t)),lo:Math.round(Math.min.apply(null,t)),rain:r,wmax:wmax,code:code};
}

  h+='</div><button type="button" class="btn pri" data-act="open">釣果を記録</button><div style="height:12px"></div>';
  if(!rows.length){
    h+='<p class="mut">'+(S.rec.length?'この釣り場の記録はありません。':'まだ記録がありません。釣行のあとに「釣果を記録」から追加できます。')+'</p>';
  }
  rows.forEach(function(r){
    var zero=r.n===0,tags='';
    [r.wind&&'風 '+r.wind,r.wave&&'波 '+r.wave,r.tide].forEach(function(x){if(x)tags+='<span class="tag">'+esc(x)+'</span>';});
    var size=(r.smin||r.smax)?'胴長 '+(r.smin||'?')+'〜'+(r.smax||'?')+'cm':'';
    var det=[size,r.egi?'エギ '+r.egi:''].filter(Boolean).join('　');
    h+='<article class="card rec"><div class="h"><div><p class="spot">'+esc(r.spot)+'</p><p class="dt">'+labelDate(r.date)+'　'+esc(r.slot)+'</p></div>'+
      '<p class="n'+(zero?' zero':'')+'">'+r.n+'<span>杯</span></p></div>'+
      (det?'<p class="d">'+esc(det)+'</p>':'')+
      (r.memo?'<p class="d mut">'+esc(r.memo)+'</p>':'')+
      (r.photos&&r.photos.length?'<div class="ph">'+r.photos.map(function(id){return '<img data-pid="'+esc(id)+'" alt="釣果の写真" role="button" width="88" height="88">';}).join('')+'</div>':'')+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      '<button type="button" class="del" data-del="'+esc(r.id)+'">削除</button></article>';
  });
  h+='<div class="foot"><p style="margin:0">記録はこの端末のブラウザに保存されます。機種変更やデータ消去に備えて、ときどき書き出してください。</p>'+
    '<p style="margin:8px 0 0"><button type="button" class="ghost" data-act="export">書き出し</button> <button type="button" class="ghost" data-act="import">読み込み</button></p></div>';
  $('#v-catch').innerHTML=h;
  loadPhotos();
}

function renderAreaBar(){
  var names=['舞鶴'].concat(S.spots.filter(function(x){return S.pos[x];}));
  var h='<span class="mut" style="font-size:12px">予報の場所</span>';
  names.forEach(function(n){h+='<button type="button" class="chip'+(UI.area===n?' on':'')+'" data-area="'+esc(n)+'">'+esc(n)+'</button>';});
  h+='<button type="button" class="ghost" data-act="spots">釣り場を設定</button>';
  $('#areabar').innerHTML=h;
  $('.top .loc').textContent='京都府 舞鶴'+(UI.area==='舞鶴'?'':'（'+UI.area+'）');
}
function renderAll(){renderAreaBar();renderToday();renderHourly();renderCatch();}

function setStatus(){
  var o=S.ok,mark=function(v){return v===null?'…':(v?'○':'×');};
  var tideOk=Object.keys(S.tide).length?true:(S.ok.tide===false?false:null);
  var n=nowJST();
  $('#status').textContent='更新 '+n.h+':'+pad(n.m)+'　天気 '+mark(o.wx)+'　波 '+mark(o.wave)+'　潮 '+mark(tideOk)+(S.tideSrc==='model'?'（モデル値）':'');
}

function load(){
  S.areaCache={};S.ok={wx:null,wave:null,tide:null};S.tide={};seaP=null;
  $('#status').textContent='取得中…';
  loadAreaData(UI.area).then(function(e){
    applyArea(e);renderAll();setStatus();
    var n=nowJST();
    return Promise.all([0,1,2,3,4,5,6].map(function(i){return getTide(addDays(n.date,i)).catch(function(){});}));
  }).then(function(){
    S.ok.tide=Object.keys(S.tide).length>0;
    S.updated=Date.now();renderAll();setStatus();
  });
}
function setArea(name){
  UI.area=name;store.set('ika.area',name);renderAreaBar();
  $('#status').textContent='取得中…';
  loadAreaData(name).then(function(e){if(UI.area!==name)return;applyArea(e);renderAll();setStatus();});
}

function renderSpotSheet(){
  var h='';
  S.spots.forEach(function(sp){
    var p=S.pos[sp];
    h+='<div class="card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>'+esc(sp)+'</b><span class="mut" style="font-size:12px">'+(p?'位置 設定済み':'位置 未設定')+'</span></div>'+
      '<div class="row" style="margin-top:8px;flex-wrap:wrap"><button type="button" class="ghost" data-gps="'+esc(sp)+'">今いる場所にする</button><button type="button" class="ghost" data-find="'+esc(sp)+'">地名で探す</button>'+(p?'<button type="button" class="ghost" data-clr="'+esc(sp)+'">位置を消す</button>':'')+'<button type="button" class="ghost" data-rm="'+esc(sp)+'" style="color:var(--danger)">削除</button></div>';
    if(UI.found&&UI.found.spot===sp&&UI.found.list.length){
      h+='<div class="pick">';
      UI.found.list.forEach(function(f,i){h+='<button type="button" data-pick="'+i+'">'+esc(f.label)+'</button>';});
      h+='</div>';
    }
    h+='</div>';
  });
  $('#sp-list').innerHTML=h;
}
function openSpots(){UI.found=null;renderSpotSheet();$('#spsheet').classList.add('open');document.body.style.overflow='hidden';}
function closeSpots(){$('#spsheet').classList.remove('open');document.body.style.overflow='';}
function setPos(name,la,lo){
  S.pos[name]={lat:+(+la).toFixed(3),lon:+(+lo).toFixed(3)};store.set('ika.pos',S.pos);
  delete S.areaCache[name];UI.found=null;renderSpotSheet();renderAreaBar();toast(name+'の位置を設定しました');
}
function useHere(name){
  if(!navigator.geolocation){toast('この端末では位置情報を使えません');return;}
  toast('位置を取得しています…');
  navigator.geolocation.getCurrentPosition(function(p){setPos(name,p.coords.latitude,p.coords.longitude);},function(){toast('位置を取得できませんでした。設定で位置情報を許可してください');},{enableHighAccuracy:false,timeout:15000,maximumAge:60000});
}
function geoGsi(q){
  return fetchJ('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q)).then(function(a){
    return (Array.isArray(a)?a:[]).filter(function(x){return x&&x.geometry&&x.geometry.coordinates;}).map(function(x){
      var c=x.geometry.coordinates;return {label:(x.properties&&x.properties.title)||q,lat:c[1],lon:c[0]};
    });
  });
}
function geoOm(q){
  return fetchJ('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=20&language=ja&countryCode=JP').then(function(j){
    return (j.results||[]).map(function(x){return {label:x.name+'（'+[x.admin1,x.admin2||x.admin3].filter(Boolean).join(' ')+'）',lat:x.latitude,lon:x.longitude};});
  });
}
function findSpot(name){
  var q=prompt('住所や施設名で入力してください（例：舞鶴市田井、西舞鶴駅）',name);
  if(!q)return;
  q=q.trim();
  if(!q)return;
  toast('探しています…');
  geoGsi(q).catch(function(){return [];}).then(function(r){
    return r.length?r:geoOm(q).catch(function(){return null;});
  }).then(function(r){
    if(r===null){toast('検索できませんでした。通信を確認してください');return;}
    var near=function(x){return (x.lat>35.2&&x.lat<35.8&&x.lon>134.9&&x.lon<135.8)?0:1;};
    r.sort(function(a,b){return near(a)-near(b);});
    UI.found={spot:name,list:r.slice(0,8)};
    if(!r.length)toast('見つかりませんでした。「舞鶴市田井」のように市名から入力してみてください');
    renderSpotSheet();
  });
}

var idbP=null;
function idb(){
  if(idbP)return idbP;
  idbP=new Promise(function(res,rej){
    if(typeof indexedDB==='undefined'){rej(new Error('noidb'));return;}
    var q=indexedDB.open('ika-photos',1);
    q.onupgradeneeded=function(){q.result.createObjectStore('p',{keyPath:'id'});};
    q.onsuccess=function(){res(q.result);};
    q.onerror=function(){rej(q.error);};
  });
  idbP.catch(function(){idbP=null;});
  return idbP;
}
function idbOp(mode,fn){
  return idb().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction('p',mode),r=fn(tx.objectStore('p'));
    tx.oncomplete=function(){res(r&&r.result);};
    tx.onerror=tx.onabort=function(){rej(tx.error);};
  });});
}
function phPut(id,url){return idbOp('readwrite',function(s){return s.put({id:id,url:url});});}
function phGet(id){return idbOp('readonly',function(s){return s.get(id);}).then(function(o){return o?o.url:'';});}
function phDel(id){return idbOp('readwrite',function(s){return s.delete(id);});}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function shrink(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var M=1024,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,M/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      try{res(c.toDataURL('image/jpeg',0.72));}catch(e){rej(e);}
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'));};
    im.src=u;
  });
}
function drawPhotos(){
  var el=$('#f-photos');el.innerHTML='';
  F.photos.forEach(function(p,i){
    var d=document.createElement('div');d.className='pt';
    var im=document.createElement('img');im.src=p.url;im.alt='選んだ写真';
    var b=document.createElement('button');b.type='button';b.className='x';b.textContent='×';b.setAttribute('aria-label','この写真を外す');
    b.onclick=function(){F.photos.splice(i,1);drawPhotos();};
    d.appendChild(im);d.appendChild(b);el.appendChild(d);
  });
  var btn=$('#f-addph'),full=F.photos.length>=MAXPH;
  btn.textContent=full?'写真は'+MAXPH+'枚までです':'写真を追加';btn.disabled=full;
}
function savePhotos(list){
  var ids=[],failed=false;
  return list.reduce(function(p,ph){
    return p.then(function(){return phPut(ph.id,ph.url).then(function(){ids.push(ph.id);},function(){failed=true;});});
  },Promise.resolve()).then(function(){return {ids:ids,failed:failed};});
}
function loadPhotos(){
  document.querySelectorAll('#v-catch img[data-pid]').forEach(function(im){
    phGet(im.dataset.pid).then(function(u){if(u)im.src=u;else im.classList.add('miss');},function(){im.classList.add('miss');});
  });
}
function openLb(src){var b=$('#lb');$('img',b).src=src;b.classList.add('open');}
function closeLb(){$('#lb').classList.remove('open');}

function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},2000);}

function chip(container,arr,key,clearable,fmt){
  var el=$(container);el.innerHTML='';
  arr.forEach(function(x){
    var b=document.createElement('button');b.type='button';b.className='chip'+(F[key]===x?' on':'');b.textContent=fmt?fmt(x):x;
    b.onclick=function(){F[key]=(clearable&&F[key]===x)?'':x;if(key==='spot'){$('#f-err').textContent='';loadAreaData(S.pos[F.spot]?F.spot:'舞鶴').then(drawForm);}drawForm();};
    el.appendChild(b);
  });
}
function drawForm(){
  chip('#f-spots',S.spots,'spot',false);
  chip('#f-times',SLOTS,'time',false);
  chip('#f-egi',EGI,'egi',true);
  $('#f-n').textContent=F.n+'杯';
  var nm=(F.spot&&S.pos[F.spot])?F.spot:'舞鶴';
  var e=S.areaCache[nm]||(nm===UI.area?{wx:S.wx,wave:S.wave,sun:S.sun}:{wx:{},wave:{},sun:{}});
  var d=$('#f-date').value,h=slotHour(d,F.time,e.sun[d]),k=d+'T'+pad(h)+':00',w=e.wx[k],parts=[];
  if(w&&w.ws!=null)parts.push('風 '+dir8(w.wd)+' '+Math.round(w.ws)+'m');
  if(e.wave[k]!=null)parts.push('波 '+e.wave[k].toFixed(1)+'m');
  parts.push(shio(d));
  $('#f-auto').textContent=parts.length?'保存時に自動で記録：'+parts.join('・'):'この日の風・波・潮の予報値が取得できないため、状況は記録されません。';
}
function openSheet(){
  F={spot:'',time:'朝マズメ',egi:'',n:0,photos:[]};
  $('#f-perr').textContent='';
  $('#f-date').value=nowJST().date;$('#f-smin').value='';$('#f-smax').value='';$('#f-memo').value='';$('#f-newspot').value='';$('#f-err').textContent='';
  drawForm();drawPhotos();$('#sheet').classList.add('open');document.body.style.overflow='hidden';
}
function closeSheet(){$('#sheet').classList.remove('open');document.body.style.overflow='';}
function submit(){
  if(!F.spot){$('#f-err').textContent='釣り場を選んでください';return;}
  var d=$('#f-date').value;
  if(!d){$('#f-err').textContent='日付を入力してください';return;}
  var btn=$('#f-save');btn.disabled=true;btn.textContent='保存中…';
  var list=F.photos.slice();
  getConds(d,F.time,F.spot).then(function(c){
    return savePhotos(list).then(function(r){
      S.rec.push({id:newId(),ts:Date.now(),date:d,slot:F.time,spot:F.spot,n:F.n,
        smin:$('#f-smin').value,smax:$('#f-smax').value,egi:F.egi,memo:$('#f-memo').value.trim(),wind:c.wind||'',wave:c.wave||'',tide:c.tide||'',photos:r.ids});
      sortRec();saveRec();closeSheet();renderCatch();
      toast(r.failed?'記録を保存しました（写真は保存できませんでした）':'保存しました');
    });
  }).then(function(){btn.disabled=false;btn.textContent='保存';},function(){btn.disabled=false;btn.textContent='保存';});
}

function exportJ(){
  var ids=[];S.rec.forEach(function(r){(r.photos||[]).forEach(function(i){ids.push(i);});});
  Promise.all(ids.map(function(id){return phGet(id).then(function(u){return [id,u];},function(){return [id,''];});})).then(function(pairs){
    var photos={};pairs.forEach(function(p){if(p[1])photos[p[0]]=p[1];});
    var blob=new Blob([JSON.stringify({v:3,rec:S.rec,spots:S.spots,pos:S.pos,photos:photos})],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='maizuru-ika-'+nowJST().date+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  });
}
function importJ(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result),have={};S.rec.forEach(function(x){have[x.id]=1;});
      var add=(j.rec||[]).filter(function(x){return x&&x.id&&x.date&&!have[x.id];});
      var ph=j.photos||{},jobs=[];
      add.forEach(function(x){(x.photos||[]).forEach(function(id){if(ph[id])jobs.push(phPut(id,ph[id]).catch(function(){}));});});
      Promise.all(jobs).then(function(){
        S.rec=S.rec.concat(add);
        (j.spots||[]).forEach(function(sp){if(S.spots.indexOf(sp)<0)S.spots.push(sp);});
        Object.keys(j.pos||{}).forEach(function(k){if(!S.pos[k]&&j.pos[k]&&isFinite(j.pos[k].lat))S.pos[k]=j.pos[k];});store.set('ika.pos',S.pos);
        sortRec();saveRec();store.set('ika.spots',S.spots);renderCatch();toast(add.length+'件を読み込みました');
      });
    }catch(e){toast('読み込めませんでした');}
  };
  r.readAsText(file);
}

function setTab(t){
  UI.tab=t;
  $('#areabar').hidden=(t==='catch');
  ['today','hourly','catch'].forEach(function(k){$('#v-'+k).hidden=k!==t;});
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t);});
  window.scrollTo(0,0);
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-hd],[data-spot],[data-del],[data-act],[data-pid],[data-area],[data-gps],[data-find],[data-pick],[data-clr],[data-rm]');
  if(!t)return;
  if(t.dataset.tab){setTab(t.dataset.tab);return;}
  if(t.dataset.hd!=null){UI.hd=+t.dataset.hd;renderHourly();return;}
  if(t.dataset.spot){UI.spot=(t.dataset.spot!=='すべて'&&UI.spot===t.dataset.spot)?'すべて':t.dataset.spot;renderCatch();return;}
  if(t.dataset.area){setArea(t.dataset.area);return;}
  if(t.dataset.gps){useHere(t.dataset.gps);return;}
  if(t.dataset.find){findSpot(t.dataset.find);return;}
  if(t.dataset.pick!=null){var f=UI.found&&UI.found.list[+t.dataset.pick];if(f)setPos(UI.found.spot,f.lat,f.lon);return;}
  if(t.dataset.rm){
    var rn=t.dataset.rm,cnt=S.rec.filter(function(r){return r.spot===rn;}).length;
    if(confirm('「'+rn+'」を釣り場の一覧から削除しますか？'+(cnt?'\n記録済みの釣果（'+cnt+'件）は残ります。':''))){
      S.spots=S.spots.filter(function(x){return x!==rn;});store.set('ika.spots',S.spots);
      delete S.pos[rn];store.set('ika.pos',S.pos);delete S.areaCache[rn];
      if(UI.area===rn)setArea('舞鶴');
      if(F.spot===rn)F.spot='';
      renderSpotSheet();renderAreaBar();renderCatch();toast('削除しました');
    }
    return;
  }
  if(t.dataset.clr){var cn=t.dataset.clr;delete S.pos[cn];store.set('ika.pos',S.pos);delete S.areaCache[cn];if(UI.area===cn)setArea('舞鶴');renderSpotSheet();renderAreaBar();return;}
  if(t.dataset.pid){if(t.src)openLb(t.src);return;}
  if(t.dataset.del){
    if(confirm('この記録を削除しますか？')){
      var gone=S.rec.filter(function(r){return r.id===t.dataset.del;})[0];
      if(gone)(gone.photos||[]).forEach(function(id){phDel(id).catch(function(){});});
      S.rec=S.rec.filter(function(r){return r.id!==t.dataset.del;});saveRec();renderCatch();
    }
    return;
  }
  var a=t.dataset.act;
  if(a==='open')openSheet();
  else if(a==='close')closeSheet();
  else if(a==='spots')openSpots();
  else if(a==='spclose')closeSpots();
  else if(a==='spadd'){
    var nv=$('#sp-new').value.trim();
    if(nv){if(S.spots.indexOf(nv)<0){S.spots.push(nv);store.set('ika.spots',S.spots);}$('#sp-new').value='';renderSpotSheet();renderCatch();}
  }
  else if(a==='minus'){if(F.n>0)F.n--;drawForm();}
  else if(a==='plus'){F.n++;drawForm();}
  else if(a==='addspot'){
    var v=$('#f-newspot').value.trim();
    if(v){if(S.spots.indexOf(v)<0){S.spots.push(v);store.set('ika.spots',S.spots);}F.spot=v;$('#f-newspot').value='';$('#f-err').textContent='';drawForm();}
  }
  else if(a==='save')submit();
  else if(a==='pickphoto')$('#f-file').click();
  else if(a==='closelb')closeLb();
  else if(a==='toggleall'){UI.all=!UI.all;renderHourly();}
  else if(a==='export')exportJ();
  else if(a==='import')$('#importer').click();
  else if(a==='sethc'){
    var v2=parseInt($('#hc').value,10);
    if(v2>0){
      store.set('ika.hc',v2);store.del('ika.hcfail');hcP=null;
      Object.keys(S.tide).forEach(function(k){store.del('ika.tide.'+k);});
      load();toast('港コードを設定しました');
    }else{
      store.del('ika.hc');store.del('ika.hcfail');hcP=null;
      Object.keys(S.tide).forEach(function(k){store.del('ika.tide.'+k);});
      load();toast('港コードを自動検出します');
    }
  }
});
$('#refresh').addEventListener('click',function(){load();});
$('#f-date').addEventListener('change',drawForm);
$('#f-file').addEventListener('change',function(e){
  var fs=Array.prototype.slice.call(e.target.files||[]).slice(0,MAXPH-F.photos.length);
  e.target.value='';
  if(!fs.length)return;
  $('#f-perr').textContent='';
  var b=$('#f-addph');b.disabled=true;b.textContent='読み込み中…';
  fs.reduce(function(p,f){
    return p.then(function(){return shrink(f).then(function(url){F.photos.push({id:newId(),url:url});},function(){$('#f-perr').textContent='読み込めない写真がありました';});});
  },Promise.resolve()).then(drawPhotos);
});
$('#importer').addEventListener('change',function(e){var f=e.target.files[0];if(f)importJ(f);e.target.value='';});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeLb();closeSheet();closeSpots();}});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&S.updated&&Date.now()-S.updated>20*60*1000)load();
});

S.rec=store.get('ika.rec.v1',[]);sortRec();
S.spots=store.get('ika.spots',SPOTS0.slice());
S.pos=store.get('ika.pos',{});UI.area=store.get('ika.area','舞鶴');if(UI.area!=='舞鶴'&&!S.pos[UI.area])UI.area='舞鶴';
pruneCache();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
renderAll();
load();
})();
</script>
